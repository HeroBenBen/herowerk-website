# ============================================================
# Apache-Zusatzkonfiguration fuer den Pruefserver der CI (07.08.2026).
#
# WARUM ES DIESE DATEI GIBT
# Bis zum 07.08.2026 liefen sieben CI-Pruefungen gegen eine Vorschau bei Vercel.
# Vercel liest die .htaccess NICHT, sondern nimmt seine Kopfzeilen aus vercel.json.
# Die Kopfzeilen-Pruefung hat dadurch jahrelang einen Stand geprueft, der beim
# Kunden gar nicht ausgeliefert wird. Seit dem GF-Entscheid vom 07.08.2026
# (Vercel wird abgeschafft) laufen die Pruefungen gegen einen echten Apache im
# Pruef-Laufband, der das FERTIGE IONOS-Buendel mit der PRODUKTIVEN .htaccess
# ausliefert. Damit prueft die CI erstmals genau das, was hochgeladen wird.
#
# WARUM NICHT "php -S" ODER EIN STATISCHER MINI-SERVER
# Beide werten keine .htaccess aus. Rewrites (saubere Adressen ohne .html),
# Weiterleitungen und alle Sicherheitskopfzeilen kaemen nicht an, die
# Kopfzeilen-Pruefung waere stumm gruen. Deshalb Apache mit AllowOverride All.
#
# Diese Datei wird von scripts/start-pruefserver.sh in den Apache-Container
# gehaengt und NACH der Grundkonfiguration eingelesen.
# ============================================================

# Die vier Module, die die produktive .htaccess braucht. Im Grundbild des
# Apache-Containers sind sie auskommentiert. Ist eines schon geladen, meldet
# Apache das als Hinweis und faehrt fort.
LoadModule rewrite_module modules/mod_rewrite.so
LoadModule headers_module modules/mod_headers.so
LoadModule expires_module modules/mod_expires.so
LoadModule deflate_module modules/mod_deflate.so
LoadModule filter_module modules/mod_filter.so

# Ohne AllowOverride All bleibt die .htaccess wirkungslos und alle darauf
# gebauten Pruefungen waeren still gruen.
<Directory "/usr/local/apache2/htdocs">
    AllowOverride All
    Options -Indexes
    Require all granted
</Directory>

# Der Pruefserver ist ausschliesslich im Laufband erreichbar und wird nach dem
# Lauf verworfen. Trotzdem bekommt er die Sperre fuer Suchmaschinen, damit ein
# versehentlich nach aussen gereichter Lauf nie eine zweite auffindbare Fassung
# der Website erzeugen kann (Anlass: die oeffentlich erreichbare Vercel-Fassung,
# gefunden am 07.08.2026).
<IfModule mod_headers.c>
    Header always set X-Robots-Tag "noindex, nofollow"
</IfModule>
