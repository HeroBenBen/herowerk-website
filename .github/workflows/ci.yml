# HeroWerk CI: harte Gates und ausgewiesene Berichte.
#
# WARUM DER NAME NICHT MEHR "12 Hard-Gates" LAUTET (gemessen 29.07.2026 ueber die
# letzten 25 Laeufe dieses Workflows, Quelle: actions/runs/*/jobs):
#   axe-accessibility      0 gruen / 20 rot / 5 uebersprungen
#   content-fidelity       0 gruen / 20 rot / 5 uebersprungen
#   playwright-smoke       0 gruen / 20 rot / 5 uebersprungen
#   lighthouse (dark)      0 gruen / 12 rot / 8 abgebrochen
#   lighthouse (light)     0 gruen /  8 rot / 12 abgebrochen
#   seo-basics             0 gruen /  0 rot / 25 UEBERSPRUNGEN
#   schema-validation      0 gruen /  0 rot / 25 UEBERSPRUNGEN
# Dazu kam: im Branch-Schutz von main war required_status_checks.contexts LEER, keine
# einzige dieser Pruefungen war Pflicht. Zwoelf Jobs hiessen "Hard-Gate" und keiner
# hat je einen Merge verhindert.
#
# Zwei Befunde waren dabei schlimmer als "rot":
#   - seo-basics und schema-validation haben in 25 Laeufen KEIN EINZIGES MAL
#     ausgefuehrt. Sie hingen per needs am lighthouse-Job, und weil der nie gruen
#     wurde, wurden sie immer uebersprungen. Beide bestehen inhaltlich, gemessen am
#     29.07. gegen die Vorschau: "SEO-Basics-Check OK" und "Rich-Results-Check OK".
#     Ihre needs zeigen jetzt auf lint, nicht mehr auf lighthouse.
#   - visual-regression war 20 von 20 Laeufen GRUEN und hat dabei nichts gemessen:
#     baseline/visual/ enthaelt ausser .gitkeep keine einzige PNG, deshalb ruft jeder
#     Testfall test.skip() auf. Eine Pruefung, die immer gruen ist, ist genauso
#     wertlos wie eine, die immer rot ist. Der Job heisst jetzt so, wie er sich
#     verhaelt.
#
# Grundsatz ab hier: jeder Job ist entweder ein hartes Gate, das gruen ist und etwas
# misst, ODER er traegt "Bericht" im Namen und continue-on-error, mit dem GEMESSENEN
# Grund und dem Rueckweg direkt darueber. Nichts dazwischen.
#
# UMSTELLUNG 07.08.2026: PRUEFZIEL IST NICHT MEHR VERCEL
# GF-Entscheid vom 07.08.2026 (_Entscheidungen/2026-08-07_Vercel-abschaffen-
# Pausieren-Umzug-Loeschen_HERO.md): Vercel wird abgeschafft. Sieben Pruefungen
# hingen ueber den Helfer-Job resolve-preview an einer Vercel-Vorschau. Der Helfer
# ist ersatzlos entfallen; jede dieser Pruefungen startet sich statt dessen mit
# scripts/start-pruefserver.sh einen echten Apache im Laufband, der das FERTIGE
# IONOS-Buendel mit der PRODUKTIVEN .htaccess ausliefert.
# Drei Gewinne, alle gemessen: die CI prueft erstmals genau das Paket, das
# hochgeladen wird; die Sicherheitskopfzeilen kommen aus der produktiven Quelle
# statt aus vercel.json; und es entsteht keine oeffentlich erreichbare
# Zweitfassung der Website mehr (Anlass: Befund vom 07.08.2026).
name: HeroWerk CI (Hard-Gates + ausgewiesene Berichte)
on:
  pull_request:
    branches: [main, production]
    # production: der Release-PR von main nach production (T4-2) durchlaeuft dieselbe Kette

# Least-Privilege-Token (T1-6b-Followup O2): expliziter Block ersetzt die Defaults.
# Jobs mit Sonderbedarf (secret-scan) haben Job-Level-Blöcke.
permissions:
  contents: read

# Adresse des Pruefservers. Seit dem 07.08.2026 gibt es keinen Helfer-Job mehr, der
# auf eine Vercel-Vorschau wartet: jeder Job startet sich seinen eigenen Apache im
# Laufband (scripts/start-pruefserver.sh) und misst dagegen. Port 8080 ist derselbe
# Standardwert wie in playwright.config.js, damit lokal und in der CI dieselbe
# Adresse gilt.
env:
  PRUEFSERVER_URL: http://127.0.0.1:8080

jobs:
  # Job 1: Lint + Type-Check
  lint:
    runs-on: ubuntu-latest
    steps:
      # Vollständige Historie ist Pflicht: das Testlisten-Gate unterscheidet über
      # origin/main zwischen neu angelegten Seiten und dem gemeldeten Altbestand.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with: { node-version: '20' }
      # Der Snapshot-Nachlauf ist PHP-Code. Bis zu diesem Auftrag richtete der
      # Lint-Auftrag ausschließlich Node ein. PHP 8.1 ist bewusst die älteste
      # Fassung, deren Sprachmerkmale der produktive Rechenkern bereits nutzt.
      # Die Übereinstimmung mit IONOS bleibt offen, bis der Geschäftsführer die
      # dort eingestellte Fassung aus der Webhoster-Verwaltung nachträgt.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit  # JSDoc-Type-Check via tsconfig.json mit allowJs+checkJs
      - run: npm run verify:website-gates
      - run: npm run verify:rechner-snapshot-nachlauf
      # Cache-Busting-Gate (G3-N2, 25.07.2026): jede lokale CSS-/JS-Referenz muss
      # den aktuellen Inhalts-Fingerabdruck tragen. Ohne das liefert der 1-Jahres-
      # Cache aus .htaccess Bestandsbesuchern alte Dateien aus (zweimal real
      # passiert: Lead-Handoff 04.07., Umschalter-Optik 25.07.).
      - run: npm run verify:assets
      # Versions-Gate (30.07.2026): läuft bewusst vor Consent, Raster und Mobile.
      # Raster und Mobile schreiben Berichte nach reports/; danach wäre der
      # Arbeitsbaum nicht sauber und der Schmutz-Abbruch des Stempels müsste rot
      # werden, obwohl der Checkout vor diesen Berichtsläufen sauber war.
      - run: scripts/make-ionos-bundle.sh /tmp/bundle-pruefung
      - run: scripts/stamp-version.sh --check /tmp/bundle-pruefung
      - run: scripts/stamp-version.sh --selbsttest
      # Consent-Gate (25.07.2026): Auf allen produktiven Seiten muss das synchrone
      # CMP-Autoblocking das erste Skript sein. Beide CSP-Quellen müssen den
      # Delivery-Host unter script-src erlauben; connect-src allein reicht nicht.
      - run: npm run verify:consent
      # Fluchten-Gate (GF-Auftrag 26.07.2026): Norm-Messungen (Kontrast,
      # Trefferflaechen, Ueberlauf) sagen nichts ueber Fluchten und Proportionen.
      # Am 26.07. ragte ein Knopf auf jeder Telefonbreite 29 px aus seiner Karte,
      # obwohl vier unabhaengige Abnahmen gruen gemeldet hatten. Das Gate prueft
      # je Seite und Breite hart: Container-Ueberstand (1), Aussenbreite statt
      # Inhaltsbreite (3), Seitenrand-Treue vollbreiter Container (4),
      # erklaerter Seitenversatz schmalerer Bloecke (5) und
      # Fensterkanten-Ueberstand (6). Das Kanten-Inventar (2) laeuft als Bericht
      # OHNE Fehlerabbruch, solange die Kanten-Erwartung nicht ratifiziert ist
      # (scripts/raster-expect.json).
      # Rueckgabewerte: 1 Layoutbefund, 2 Ausnahme ohne Feld grund,
      # 3 unmoegliche Messzahl, 4 Lauf ohne Messung und damit ungueltig.
      - run: npx playwright install --with-deps chromium
      - run: npm run verify:raster
      # Mobile-Gate (Fixplan G4, 27.07.2026): die zehn Punkte der Mobil-Abnahme
      # ueber vier Breiten und beide Modi. Bis dahin lief diese Pruefung als
      # Wegwerf-Skript im Arbeitsordner und war fuer Dritte nicht nachfahrbar.
      # Punkt 7 (Einwilligungsdialog) ist bewusst NICHT maschinell abgedeckt und
      # im Bericht als Luecke ausgewiesen, siehe docs/compliance/bfsg-scope.md.
      - run: npm run verify:mobile
      # Strukturdaten-Gate (Fixplan G4, 28.07.2026): die JSON-LD-Bloecke werden aus
      # dem SICHTBAREN Seiteninhalt erzeugt, nicht von Hand gepflegt. Dieses Gate
      # prueft, dass Auszeichnung und sichtbarer Inhalt nicht auseinanderlaufen.
      # Schaerfe-Nachweis 28.07.: eine geaenderte Antwort und eine neu eingefuegte
      # Frage schlagen beide an, der unveraenderte Stand meldet 0 Abweichungen.
      # Der Jobs-Schnappschuss wird bewusst NICHT im CI neu geholt, sonst haengt
      # das Gate am Google-Sheet. Neu holen von Hand: npm run build:seo:jobs.
      - run: npm run verify:seo
      # Pfadzeile, zitierfaehiger Fakt-Satz und Begriffsblock: Inhalt aus
      # scripts/seiten-bausteine.json, GF-freigegeben 28.07.2026. Das Gate prueft
      # zusaetzlich, dass JEDE Zahl im Fakt-Satz auf derselben Seite sichtbar steht.
      - run: npm run verify:bausteine
      # Antragsdatum-Gate (Vorgang T616, 20.08.2026): Foerderrechner und Kostenvergleich muessen
      # fuer denselben Kundenfall zifferngleich sein, das gewaehlte Antragsdatum muss die
      # Foerderung steuern, und der Installationstermin darf sie NICHT veraendern. Anlass: am
      # 20.08.2026 versprach die Foerderseite bei Antrag im Maerz 2027 noch 12.880 statt
      # 11.445 Euro, weil sie fest auf heute rechnete.
      - run: npm run verify:antragsdatum
        # Zweiter Teil dieses Gates seit 21.08.2026 (T617): der Apps-Script-Rueckfall muss
        # zeichengleich dasselbe liefern wie der PHP-Kern, Werte UND Feldreihenfolge. Die Website
        # faellt in zwei Faellen auf ihn zurueck, und am 21.08. hat er dabei 12.880 statt
        # 11.445 Euro versprochen.

  # Job 2: Lighthouse-CI, ZURUECKGESTUFT AUF BERICHT (29.07.2026)
  #
  # GEMESSENER GRUND (lighthouse@12, Mobil-Emulation, Standard-Drosselung):
  #   Vorschau  herowerk-website-ljseuvmr9…vercel.app/?theme=dark
  #     performance 0,78   accessibility 1,00   best-practices 0,93
  #   Live      www.herowerk.de/?theme=dark
  #     performance 0,86   accessibility 1,00   best-practices 0,93
  #   Schwellen in lighthouserc.json: performance 0,90 / accessibility 0,95 /
  #   best-practices 0,95.
  # Die Schwelle fuer performance und best-practices wird auf BEIDEN Zielen verfehlt,
  # auf der Vorschau ebenso wie auf dem echten IONOS-Auslieferpfad. Es ist also kein
  # Vorschau-Artefakt, das man durch ein anderes Ziel heilen koennte.
  #   performance haengt an LCP: 4,9 s auf der Vorschau, 4,0 s live, Zielwert 2,5 s.
  #     LCP-Element ist der Textabsatz section.hero > .hero-inner p.hero-sub.
  #     TBT 0 ms und CLS 0,033 sind unauffaellig, der Verlust kommt allein aus LCP
  #     (Gewicht 25) und FCP (Gewicht 10).
  #   best-practices haengt an zwei Audits, beide mit Score 0: errors-in-console und
  #     inspector-issues. Ursache auf beiden Zielen dieselbe: die CSP erlaubt unter
  #     style-src nur 'self' und 'unsafe-inline', deshalb blockt der Browser das
  #     Stylesheet cdn.consentmanager.net/delivery/css/cmp.min.css. Live kommt ein
  #     zweiter Konsolenfehler dazu: "Uncaught TypeError: Cannot read properties of
  #     undefined (reading 'length')".
  #
  # Die Schwellen bleiben BEWUSST unveraendert. Sie herunterzusetzen wuerde den Job
  # gruen faerben, ohne dass die Seite schneller wird. Der Job traegt stattdessen
  # continue-on-error und "Bericht" im Namen.
  #
  # RUECKWEG ZUM HARTEN GATE, drei Schritte, danach continue-on-error entfernen:
  #   1. LCP: p.hero-sub rendert erst nach der Schriftenladung. Schrift vorladen bzw.
  #      font-display so setzen, dass der Text sofort steht.
  #   2. best-practices: cdn.consentmanager.net in style-src aufnehmen, in BEIDEN
  #      CSP-Quellen (.htaccess Zeile 81 und vercel.json). Beide Dateien liegen
  #      ausserhalb dessen, was der Auftrag zur Gate-Reparatur aendern darf.
  #   3. den TypeError auf der Live-Seite beheben.
  lighthouse-bericht:
    name: lighthouse-bericht (${{ matrix.theme }}, kein Hard-Gate)
    runs-on: ubuntu-latest
    needs: [lint]
    continue-on-error: true
    strategy:
      matrix: { theme: [dark, light] }
    steps:
      - uses: actions/checkout@v5
      - name: Pruefserver starten
        run: scripts/start-pruefserver.sh
      - name: Lighthouse CI ${{ matrix.theme }}
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            ${{ env.PRUEFSERVER_URL }}?theme=${{ matrix.theme }}
            ${{ env.PRUEFSERVER_URL }}/preise.html?theme=${{ matrix.theme }}
            ${{ env.PRUEFSERVER_URL }}/anfrage.html?theme=${{ matrix.theme }}
          configPath: ./lighthouserc.json
          uploadArtifacts: true
          runs: 3

  # Job 3: Playwright Smoke-Tests
  playwright-smoke:
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
      - run: npm ci
      - run: npx playwright install --with-deps
      - name: Pruefserver starten
        run: scripts/start-pruefserver.sh
      - env: { PREVIEW_URL: '${{ env.PRUEFSERVER_URL }}' }
        run: npx playwright test --grep "@smoke"

  # Job 4: axe-core Accessibility, bleibt HARTES GATE
  #
  # Ist-Messung 29.07.2026 ueber 13 Seiten in beiden Modi: 32 beanstandete Knoten.
  # Davon 26 aus EINEM Fremdkoerper, der Schaltflaeche .cmpboxrecall, die der
  # Einwilligungsanbieter per Skript ausserhalb jeder Landmarke an den Seitenkoerper
  # haengt (Regel "region"). Fremdes Markup, von uns nicht aenderbar, und solange es
  # mitgemessen wird, ist jede Seite rot und der echte Rest unsichtbar.
  # Die Wurzeln des Anbieters sind deshalb vom Scan ausgenommen, NUR die Wurzeln.
  # Die verbleibenden 6 Knoten sind echte Befunde im eigenen Markup und stehen
  # namentlich mit Messung, Datum und Rueckweg in tests/axe-bekannte-befunde.json:
  #   /preise.html light      color-contrast        1 Knoten
  #   /foerderung.html light  link-in-text-block    5 Knoten
  # Das Gate ist in BEIDE Richtungen scharf: neue oder gewachsene Befunde machen rot,
  # und ein Eintrag, der nicht mehr auftritt, macht ebenfalls rot, damit die Liste
  # nicht still veraltet. Begruendung im Detail: tests/helpers/axe.js.
  axe-accessibility:
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v5
      - run: npm ci
      - run: npx playwright install --with-deps
      - name: Pruefserver starten
        run: scripts/start-pruefserver.sh
      - env: { PREVIEW_URL: '${{ env.PRUEFSERVER_URL }}' }
        run: npm run test:a11y

  # Job 3b: Einwilligungsdialog gegen die ECHTE Domain, BERICHT, kein Hard-Gate
  #
  # GEMESSENER GRUND (29.07.2026, Vorschau UND www.herowerk.de):
  # Die Vermutung, der Dialog sei an herowerk.de gebunden und koenne auf einer
  # vercel.app-Adresse gar nicht ausliefern, ist WIDERLEGT: auf der Vorschau antworten
  # autoblocking-Skript, cmp_final.min.js, cmp.php?id=173772&h=<vercel-Host> und das
  # customdata-Skript alle mit 200, window.__cmp ist eine Funktion.
  # Der Dialog fehlt trotzdem auf BEIDEN Zielen. __cmp('getCMPData') meldet live
  # consentExists=true bei null gesetzten Cookies und vendorsCount=0; sichtbar ist nur
  # die Wieder-Oeffnen-Schaltflaeche .cmpboxrecall. Der Mandant 173772 liefert derzeit
  # also ueberhaupt keinen Dialog aus. Zusaetzlich blockt die CSP beider Ziele unter
  # style-src das Stylesheet cdn.consentmanager.net/delivery/css/cmp.min.css.
  # Weil die Pruefung auf dem PR-Ziel baulich nicht bestehen KANN, laeuft sie hier
  # gegen die echte Domain, mit klarem Namen und ohne Merge-Sperre. Der Teil, der auf
  # der Vorschau ehrlich beweisbar ist, naemlich dass ohne Zustimmung kein GA4- und
  # kein Meta-Skript laedt, bleibt hart in playwright-smoke.
  #
  # RUECKWEG ZUM HARTEN GATE: Mandant 173772 so konfigurieren, dass fuer GDPR-Besucher
  # ein Dialog ausgeliefert wird, und cdn.consentmanager.net in beiden CSP-Quellen
  # unter style-src erlauben. Danach continue-on-error entfernen.
  # ACHTUNG: dieser Job ist eine Compliance-Warnung, kein Schoenheitsfehler.
  consent-live-bericht:
    name: consent-live-bericht (www.herowerk.de, kein Hard-Gate)
    runs-on: ubuntu-latest
    needs: lint
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: '20' }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --grep "@live"

  # Job 5: Secret-Scanner (Gitleaks)
  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read       # checkout (fetch-depth 0)
      pull-requests: read  # gitleaks: PR-Commit-Listing via GITHUB_TOKEN (Portal-403-Fix)
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v3
        env: { GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }

  # Job 6: Content-Fidelity-Check gegen v4-Baseline
  content-fidelity:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v5
      - run: node scripts/content-fidelity-check.js
        # Skript scannt Section-Wortzählung gegen baseline/v4-sections.json
        # Section-Regel: <section id> primär, H2-Fallback, FAQ separat
        # Fail bei > 30% Abweichung pro Section (Stand-Schwelle, in T1-6b ratifiziert)

  # Job 7: Sicherheitskopfzeilen, Zusage aus .htaccess gegen Auslieferung
  #
  # UMSTELLUNG 07.08.2026 (Vercel-Abschaffung). Bis hierher rief dieser Job den
  # FREMDEN Mozilla-Observatory-Dienst mit der Vercel-Adresse auf und liess sich
  # eine Schulnote geben. Das hatte drei Schwaechen, alle gemessen am 07.08.:
  #   1. Vercel liest die .htaccess nicht, sondern nimmt seine Kopfzeilen aus
  #      vercel.json. Geprueft wurde also der Stand, der beim Kunden NICHT
  #      ankommt. Gegenprobe an der Vorschau: sie erlaubte in connect-src noch
  #      script.googleusercontent.com, das produktiv bewusst entfernt wurde, und
  #      lieferte eine andere HSTS-Dauer.
  #   2. Ein fremder Scanner kann einen Pruefserver im Laufband nicht erreichen
  #      und bewertet hinter einem Zugriffsschutz die Passwortseite.
  #   3. Eine Schulnote B bleibt gruen, auch wenn eine einzelne Regel verschwindet.
  # Die neue Pruefung vergleicht jede Zeile "Header always set" aus der
  # produktiven .htaccess wortgleich gegen die Antwort des Pruefservers und
  # verlangt zusaetzlich sechs Pflichtkopfzeilen. Schaerfe belegt am 07.08.:
  # gegen die Live-Seite Rueckgabewert 0, gegen die abweichende Vercel-Vorschau
  # Rueckgabewert 1.
  csp-headers:
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v5
      - name: Pruefserver starten
        run: scripts/start-pruefserver.sh
      - run: node scripts/header-check.js ${{ env.PRUEFSERVER_URL }}
      - run: npm run verify:rechner-snapshot-apache

  # Job 8: HubSpot-Property-Mapping-Test (Schema-Validierung)
  hubspot-mapping:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v5
      - run: node scripts/hubspot-schema-check.js
        # Validiert Webhook-Payload gegen schemas/hubspot-property-schema.json

  # Job 9: Visual-Regression, INAKTIV, misst derzeit nichts (festgestellt 29.07.2026)
  #
  # Der Job war in den letzten 20 ausgefuehrten Laeufen 20 mal gruen. Gemessen hat er
  # dabei nichts: baseline/visual/ enthaelt ausser .gitkeep keine einzige PNG, und
  # tests/visual/visual-shared.js ruft deshalb in JEDEM Testfall test.skip() auf. Ein
  # gruener Haken ohne Messung ist gefaehrlicher als ein roter, weil er Sicherheit
  # vortaeuscht. Der Job behaelt seine Verdrahtung, heisst aber jetzt so, wie er sich
  # verhaelt, und darf ausdruecklich NICHT als Pflichtpruefung in den Branch-Schutz.
  #
  # RUECKWEG: Benjamin setzt an einem PR das Label /baseline-update, der Lauf legt die
  # ersten ratifizierten Screenshots in baseline/visual/ ab. Ab der ersten PNG laufen
  # die Faelle echt, dann Namen und diesen Kommentar zuruecknehmen.
  visual-regression-inaktiv:
    name: visual-regression (inaktiv, keine ratifizierte Baseline)
    runs-on: ubuntu-latest
    needs: [lint]
    strategy:
      matrix: { theme: [dark, light] }
    steps:
      - uses: actions/checkout@v5
      - run: npm ci
      - run: npx playwright install --with-deps
      - name: Pruefserver starten
        run: scripts/start-pruefserver.sh
      - env: { PREVIEW_URL: '${{ env.PRUEFSERVER_URL }}' }
        run: npx playwright test --grep "@visual" -- --theme=${{ matrix.theme }}
        # Toleranz: 5% Pixel-Diff. Baseline-Update via /baseline-update-Label am PR
        # (Benjamin setzt Label, Github-Action akzeptiert dann den neuen Screenshot)

  # Job 10: SEO-Basics-Check
  # needs zeigte bis 29.07.2026 auf lighthouse. Weil lighthouse nie gruen wurde, ist
  # dieser Job in 25 aufeinanderfolgenden Laeufen 25 mal UEBERSPRUNGEN worden und hat
  # kein einziges Mal gemessen. Inhaltlich besteht er: Lauf vom 29.07. gegen die
  # Vorschau meldet "SEO-Basics-Check OK". Es gibt auch keinen fachlichen Grund fuer
  # die Abhaengigkeit, die Pruefung braucht nur eine erreichbare Vorschau.
  seo-basics:
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v5
      - name: Pruefserver starten
        run: scripts/start-pruefserver.sh
      - run: node scripts/seo-basics-check.js ${{ env.PRUEFSERVER_URL }}
        # Prüft: sitemap.xml erreichbar, robots.txt existiert, Canonical pro Seite,
        # Open Graph Tags, Twitter Cards, Schema.org JSON-LD, Theme-Color Meta

  # Job 11: Schema.org-Validator (Google Rich Results)
  # Gleiche Vorgeschichte wie seo-basics: 25 von 25 Laeufen uebersprungen, weil needs
  # auf lighthouse zeigte. Lauf vom 29.07. gegen die Vorschau meldet
  # "Rich-Results-Check OK (1 JSON-LD-Block/Bloecke)".
  schema-validation:
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v5
      - name: Pruefserver starten
        run: scripts/start-pruefserver.sh
      - run: node scripts/rich-results-check.js ${{ env.PRUEFSERVER_URL }}

  # Job 12: Lead-only-Negativ-Gate (verhindert Vertragsabschluss-CTA)
  # Codex-Iteration-3-Finding 6 : Pattern erweitert
  lead-only-gate:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v5
      - name: Forbidden CTA Pattern Check
        run: |
          # HARTE LINIE (Lead-only-Grundsatzentscheidung 09.06.2026): Das Gate verbietet NUR
          # Formulierungen, die einen Online-Vertragsabschluss auslösen oder dazu auffordern.
          #
          # TON-/STIL-WORDING ("verbindlicher Preis", "Festpreis", "verbindliches Angebot",
          # "Angebot sichern", "Termin verbindlich", "Fördervorschuss sichern", "Auftragserteilung"
          # als Prozessbeschreibung) ist seit Iteration 4 BEWUSST NICHT im Gate: werbliche
          # Risiko-Kalibrierung ist Geschäftsführer-Entscheidung und wird editorial in T1-11
          # entschieden (GF-Entscheidung 10.06.2026). Pattern-Erweiterung nur mit Benjamin-GO.
          # Codex-Mini-Check-Fix 2: + jetzt bestellen/bezahlen, Bestellung abschließen, Angebot annehmen, Vertrag unterzeichnen
          FORBIDDEN="beauftragen|Auftrag erteilen|Auftrag bestätigen|verbindlich (bestellen|buchen|kaufen)|Vertrag (abschließen|schließen|unterzeichnen)|jetzt (kaufen|bestellen|bezahlen)|kostenpflichtig bestellen|zahlungspflichtig|Reservierung abschließen|Bestellung abschließen|Angebot annehmen"
          if grep -rEi "$FORBIDDEN" --include="*.html" --include="*.js" .; then
            echo "::error::Lead-only-Negativ-Gate verletzt: Vertragsabschluss-CTA gefunden"
            exit 1
          fi
          echo "Lead-only-Negativ-Gate: OK"
